        function geo_json_a6c2346eba906e59e2ee7636582df271_highlighter(feature) {
            switch(feature.id) {
                default:
                    return {"weight": 12};
            }
        }
        function geo_json_a6c2346eba906e59e2ee7636582df271_pointToLayer(feature, latlng) {
            var opts = {
  "stroke": true,
  "color": "#800080",
  "weight": 3,

  "lineCap": "round",
  "lineJoin": "round",

};

        function geo_json_a6c2346eba906e59e2ee7636582df271_onEachFeature(feature, layer) {

            layer.on({

                },
                mouseover: function(e) {
                    if(typeof e.target.setStyle === "function"){
                        const highlightStyle = geo_json_a6c2346eba906e59e2ee7636582df271_highlighter(e.target.feature)
                        e.target.setStyle(highlightStyle);
                    }
                },
            });
        };
        var geo_json_a6c2346eba906e59e2ee7636582df271 = L.geoJson(null, {
                onEachFeature: geo_json_a6c2346eba906e59e2ee7636582df271_onEachFeature,
            
                pointToLayer: geo_json_a6c2346eba906e59e2ee7636582df271_pointToLayer,
            ...{
}

            geo_json_a6c2346eba906e59e2ee7636582df271_add({"bbox": [-77.041315, -25.4295963, 9.1594985, 45.46129315], "features": [{"bbox": [-49.2712724, -25.4295963, -49.2712724, -25.4295963], "geometry": {"coordinates": [-49.2712724, -25.4295963], "type": "Point"}, "id": "0", "properties": {"Place:": "\u003ca href=\"https://kauevestena.github.io/opensidewalkmap_beta/\"\u003eCuritiba\u003c/a\u003e", "center_lat": -25.4295963, "center_long": -49.2712724, "city_name": "Curitiba", "url": "https://kauevestena.github.io/opensidewalkmap_beta/"}, "type": "Feature"}, {"bbox": [-77.041315, -12.065698, -77.041315, -12.065698], "geometry": {"coordinates": [-77.041315, -12.065698], "type": "Point"}, "id": "1", "properties": {"Place:": "\u003ca href=\"https://opensidewalkmap.github.io/lima/\"\u003eLima\u003c/a\u003e", "center_lat": -12.065698, "center_long": -77.041315, "city_name": "Lima", "url": "https://opensidewalkmap.github.io/lima/"}, "type": "Feature"}, {"bbox": [9.1594985, 45.46129315, 9.1594985, 45.46129315], "geometry": {"coordinates": [9.1594985, 45.46129315], "type": "Point"}, "id": "2", "properties": {"Place:": "\u003ca href=\"https://opensidewalkmap.github.io/milan/\"\u003eMilan\u003c/a\u003e", "center_lat": 45.46129315, "center_long": 9.1594985, "city_name": "Milan", "url": "https://opensidewalkmap.github.io/milan/"}, "type": "Feature"}], "type": "FeatureCollection"});
        geo_json_a6c2346eba906e59e2ee7636582df271.setStyle(function(feature) {return feature.properties.style;});

        
    
    geo_json_a6c2346eba906e59e2ee7636582df271.bindPopup(
    function(layer){
    let div = L.DomUtil.create('div');
    
    let handleObject = feature => {
        if (feature === null) {
            return '';
        } else if (typeof(feature)=='object') {
            return JSON.stringify(feature);
        } else {
            return feature;
        }
    }
    let fields = ["Place:"];
    let aliases = ["Place:"];
    let table = '<table>' +
        String(
        fields.map(
        (v,i)=>
        `<tr>
            <th>${aliases[i].toLocaleString()}</th>
            
            <td>${handleObject(layer.feature.properties[v]).toLocaleString()}</td>
        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }
    ,{
  "className": "foliumpopup",
});

            var geo_json_a6c2346eba906e59e2ee7636582df271searchControl = new L.Control.Search({

                    })

                    });
                });
